<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>MySANY · 登录</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div class="stage">
  <div class="device">

    <!-- ── 状态栏 ─────────────────────────────────────── -->
    <div class="statusbar">
      <span class="sb-time">10:33</span>
      <span class="sb-right">
        <svg class="sb-signal" viewBox="0 0 17 11" aria-hidden="true">
          <circle cx="1.5" cy="9.5" r="1.5"/>
          <circle cx="5.5" cy="9.5" r="1.5"/><circle cx="5.5" cy="5.8" r="1.5"/>
          <circle cx="9.5" cy="9.5" r="1.5"/><circle cx="9.5" cy="5.8" r="1.5"/><circle cx="9.5" cy="2.1" r="1.5"/>
          <rect x="12" y="0" width="3" height="11" rx="1.5"/>
        </svg>
        <span class="sb-5g">5G</span>
        <svg class="sb-battery" viewBox="0 0 27 13" aria-hidden="true">
          <clipPath id="batClip"><rect x="0" y="0" width="25" height="13" rx="4.2"/></clipPath>
          <rect x="0" y="0" width="25" height="13" rx="4.2" fill="#D4D4D9"/>
          <rect x="0" y="0" width="20.8" height="13" fill="#0B0B0F" clip-path="url(#batClip)"/>
          <path d="M25.9 4.3c.9.3 1.1 1 1.1 2.2s-.2 1.9-1.1 2.2z" fill="#D4D4D9"/>
          <text x="10.4" y="9.9" text-anchor="middle" font-size="9.2" font-weight="700" fill="#fff">83</text>
        </svg>
      </span>
    </div>

    <!-- ── 页面主体 ───────────────────────────────────── -->
    <main class="page">

      <img class="logo" src="assets/sany-logo.svg" alt="SANY" width="73" height="15">

      <!-- 登录方式切换 -->
      <div class="tabs" role="tablist">
        <button class="tab is-active" role="tab" aria-selected="true"  data-tab="phone">手机</button>
        <button class="tab"           role="tab" aria-selected="false" data-tab="account">账号</button>
        <span class="tab-ink" aria-hidden="true"></span>
      </div>

      <!-- 手机号登录 -->
      <section class="panel is-active" data-panel="phone" role="tabpanel">
        <button class="field field-tap" id="countryBtn">
          <svg class="fi" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.1 1.2c.5 0 .9.4.9.9v.3c2.3-.9 4-.1 5.4.5 1.2.5 2.1.9 3.2.4l1.1-.5c.6-.3 1.3.2 1.3.8v6.2c0 .3-.2.6-.5.8l-1.3.6c-1.8.8-3.4.1-4.7-.4-1.3-.6-2.5-1.1-4.5-.2v4.3c0 .5-.4.9-.9.9s-.9-.4-.9-.9V2.1c0-.5.4-.9.9-.9z"/></svg>
          <span class="f-value" id="countryName">中国</span>
          <svg class="chev" viewBox="0 0 12 20" aria-hidden="true"><path d="M2 2l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <label class="field">
          <svg class="fi" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.2 1.6c.5-.2 1.1 0 1.4.5l1.3 2.4c.3.5.1 1.2-.4 1.5l-1 .6c-.2.1-.3.4-.2.6.5 1.2 1.5 2.2 2.7 2.9.2.1.5 0 .6-.2l.6-1c.3-.5 1-.7 1.5-.4l2.4 1.3c.5.3.7.9.5 1.4l-.5 1.2c-.3.7-1 1.2-1.8 1.1-2.2-.1-4.3-1.2-6-2.9S3 6.6 2.9 4.4c0-.8.4-1.5 1.1-1.8z"/></svg>
          <span class="f-dial" id="dialCode">+86</span>
          <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="手机号码">
          <button class="f-clear" id="phoneClear" type="button" aria-label="清空" hidden>
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8"/><path d="M5.4 5.4l5.2 5.2M10.6 5.4l-5.2 5.2" stroke="#F3F4F8" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
          </button>
        </label>

        <label class="field">
          <svg class="fi" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .9l5.6 2.1c.3.1.5.4.5.7v4c0 3.2-2.3 6.1-5.8 7.3-.2.1-.4.1-.6 0C4.2 13.8 1.9 10.9 1.9 7.7v-4c0-.3.2-.6.5-.7L8 .9z"/><path d="M5.3 7.9l1.9 1.9 3.6-3.6" fill="none" stroke="#F3F4F8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <input id="code" type="tel" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="验证码">
          <button class="f-action" id="sendCode" type="button">获取验证码</button>
        </label>
      </section>

      <!-- 账号登录 -->
      <section class="panel" data-panel="account" role="tabpanel" hidden>
        <label class="field">
          <svg class="fi" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.6" r="3.3"/><path d="M8 9.3c3 0 5.5 1.8 6 4.2.1.5-.3 1-.8 1H2.8c-.5 0-.9-.5-.8-1 .5-2.4 3-4.2 6-4.2z"/></svg>
          <input id="account" type="text" autocomplete="username" placeholder="账号 / 邮箱">
        </label>

        <label class="field">
          <svg class="fi" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .9c2.1 0 3.8 1.7 3.8 3.8v1.5h-1.9V4.7c0-1-.9-1.9-1.9-1.9s-1.9.9-1.9 1.9v1.5H4.2V4.7C4.2 2.6 5.9.9 8 .9z"/><rect x="2.6" y="6.2" width="10.8" height="8.9" rx="2.4"/><circle cx="8" cy="10.1" r="1.3" fill="#F3F4F8"/><rect x="7.2" y="10.1" width="1.6" height="2.6" rx=".8" fill="#F3F4F8"/></svg>
          <input id="password" type="password" autocomplete="current-password" placeholder="密码">
          <button class="f-icon" id="togglePwd" type="button" aria-label="显示密码" aria-pressed="false">
            <svg class="eye-on" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.2c3.7 0 6.8 2.2 8.3 5.3.1.3.1.6 0 .9-1.5 3.1-4.6 5.3-8.3 5.3s-6.8-2.2-8.3-5.3a1 1 0 010-.9C3.2 6.4 6.3 4.2 10 4.2z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.6" fill="currentColor"/></svg>
            <svg class="eye-off" viewBox="0 0 20 20" aria-hidden="true" hidden><path d="M10 4.2c3.7 0 6.8 2.2 8.3 5.3.1.3.1.6 0 .9-1.5 3.1-4.6 5.3-8.3 5.3s-6.8-2.2-8.3-5.3a1 1 0 010-.9C3.2 6.4 6.3 4.2 10 4.2z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.6" fill="currentColor"/><path d="M3.4 3.4l13.2 13.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
        </label>

        <div class="row-forgot"><a href="#" data-toast="请通过手机号验证码找回密码">忘记密码?</a></div>
      </section>

      <!-- 协议勾选：两行，各自独立复选框 -->
      <div class="agreements" id="agreements">
        <label class="agree">
          <input class="cb-input" type="checkbox" id="agreeService">
          <span class="cb" aria-hidden="true">
            <svg viewBox="0 0 16 16"><path d="M3.6 8.4l3 3 5.8-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="agree-txt">同意<a href="#" class="doc-link" data-doc="service">用户服务协议</a></span>
        </label>
        <label class="agree">
          <input class="cb-input" type="checkbox" id="agreePrivacy">
          <span class="cb" aria-hidden="true">
            <svg viewBox="0 0 16 16"><path d="M3.6 8.4l3 3 5.8-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="agree-txt">同意<a href="#" class="doc-link" data-doc="privacy">隐私协议</a></span>
        </label>
      </div>

      <button class="btn-login is-disabled" id="loginBtn" type="button" aria-disabled="true">
        <span class="btn-label">登录</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      <!-- 第三方登录 -->
      <div class="socials">
        <button class="social" type="button" data-social="微信">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="20" fill="#09BB07"/>
            <path d="M16.1 10.4c-4 0-7.3 2.7-7.3 6.1 0 1.9 1.1 3.6 2.8 4.7l-.7 2.1 2.5-1.3c.9.2 1.8.4 2.7.4h.6a5.6 5.6 0 01-.2-1.5c0-3.3 3.2-5.9 7.2-5.9h.6c-.6-2.7-3.5-4.6-8.2-4.6zm-2.4 3.4a.9.9 0 110 1.9.9.9 0 010-1.9zm4.9 0a.9.9 0 110 1.9.9.9 0 010-1.9z" fill="#fff"/>
            <path d="M31.2 21.2c0-2.9-2.8-5.2-6.2-5.2s-6.2 2.3-6.2 5.2 2.8 5.2 6.2 5.2c.7 0 1.4-.1 2.1-.3l2.1 1.1-.6-1.8c1.6-.9 2.6-2.4 2.6-4.2zm-8.3-1.6a.8.8 0 110 1.6.8.8 0 010-1.6zm4.2 0a.8.8 0 110 1.6.8.8 0 010-1.6z" fill="#fff"/>
          </svg>
        </button>
        <button class="social" type="button" data-social="Facebook">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="20" fill="#1877F2"/>
            <path d="M23.4 21.4l.6-3.9h-3.7v-2.5c0-1.1.5-2.1 2.2-2.1h1.7V9.6s-1.5-.3-3-.3c-3.1 0-5.1 1.9-5.1 5.2v3h-3.4v3.9h3.4V34a13.6 13.6 0 004.2 0v-8.6h3.1z" fill="#fff"/>
          </svg>
        </button>
        <button class="social" type="button" data-social="Google">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="19.4" fill="#fff" stroke="#D3D3D6" stroke-width="1.2"/>
            <path d="M29.6 20.2c0-.7-.1-1.4-.2-2H20v3.9h5.4c-.2 1.3-.9 2.4-2 3.1v2.6h3.3c1.9-1.8 2.9-4.4 2.9-7.6z" fill="#4285F4"/>
            <path d="M20 30c2.7 0 5-.9 6.7-2.4l-3.3-2.6c-.9.6-2.1 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1h-3.4v2.7A10 10 0 0020 30z" fill="#34A853"/>
            <path d="M14.4 21.9a6 6 0 010-3.8v-2.7H11a10 10 0 000 9l3.4-2.5z" fill="#FBBC05"/>
            <path d="M20 13.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0011 15.4l3.4 2.7c.8-2.4 3-4.2 5.6-4.2z" fill="#EA4335"/>
          </svg>
        </button>
        <button class="social" type="button" data-social="Apple">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="20" fill="#313131"/>
            <path d="M25.9 20.9c0-2.4 1.9-3.5 2-3.6-1.1-1.6-2.8-1.8-3.4-1.9-1.5-.1-2.8.9-3.6.9-.7 0-1.9-.8-3.1-.8-1.6 0-3.1.9-3.9 2.4-1.7 2.9-.4 7.2 1.2 9.6.8 1.2 1.7 2.5 3 2.4 1.2 0 1.6-.8 3.1-.8s1.9.8 3.1.7c1.3 0 2.1-1.2 2.9-2.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.5-1-2.6-3.9zM23.5 13.8c.7-.8 1.1-1.9 1-3-.9 0-2.1.6-2.8 1.4-.6.7-1.1 1.9-1 3 1 .1 2.1-.5 2.8-1.4z" fill="#fff"/>
          </svg>
        </button>
      </div>

      <div class="foot">还没有账号?<a href="#" id="toRegister">注册</a></div>
    </main>

    <!-- ── 国家 / 地区选择 ─────────────────────────────── -->
    <div class="scrim" id="scrim" hidden></div>

    <div class="sheet" id="countrySheet" hidden aria-hidden="true">
      <div class="sheet-bar" aria-hidden="true"></div>
      <div class="sheet-head">
        <button class="sheet-cancel" type="button" data-close>取消</button>
        <span class="sheet-title">国家 / 地区</span>
        <span class="sheet-spacer"></span>
      </div>
      <div class="sheet-search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.9 10.9L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="countrySearch" type="search" placeholder="搜索国家 / 地区或区号">
      </div>
      <ul class="country-list" id="countryList"></ul>
    </div>

    <!-- ── 协议全文 ───────────────────────────────────── -->
    <div class="sheet sheet-doc" id="docSheet" hidden aria-hidden="true">
      <div class="sheet-bar" aria-hidden="true"></div>
      <div class="sheet-head">
        <button class="sheet-cancel" type="button" data-close>关闭</button>
        <span class="sheet-title" id="docTitle">用户服务协议</span>
        <span class="sheet-spacer"></span>
      </div>
      <div class="doc-body" id="docBody"></div>
      <div class="doc-foot">
        <button class="btn-login" id="docAgree" type="button"><span class="btn-label">同意并继续</span></button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
