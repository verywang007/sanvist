<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>MySANY · 注销申请</title>
<link rel="stylesheet" href="assets/mine.css">
<link rel="stylesheet" href="assets/cancellation.css">
</head>
<body>

<div id="root"></div>

<!-- 与现有 APP 原型一致，依赖本地 React 与 Babel，可直接双击离线运行 -->
<script src="assets/vendor/react.production.min.js"></script>
<script src="assets/vendor/react-dom.production.min.js"></script>
<script src="assets/vendor/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useEffect, useRef, useState } = React;

const STORE_KEY = 'mysany.cancelPrototype.v1';
const VALID_STATUS = ['NORMAL', 'PENDING', 'COOLING', 'REJECTED', 'REVOKED', 'PROCESSING', 'FAILED', 'CANCELLED'];

const REASONS = [
  { code: 'NO_LONGER_USE', label: '不再使用 MySANY' },
  { code: 'CHANGE_PLATFORM', label: '更换服务平台' },
  { code: 'PRIVACY', label: '隐私或个人信息原因' },
  { code: 'EXPERIENCE', label: '使用体验问题' },
  { code: 'PERSONAL', label: '个人原因' },
  { code: 'OTHER', label: '其他' },
];

const TENANT_TYPES = [
  { code: 'individual', label: '仅为个体租户', desc: '当前账户仅关联个人租户，保持现有申请信息不变。' },
  { code: 'enterprise', label: '含企业租户或代理商租户', desc: '需补充租户负责人联系电话与短信验证码，确保由授权人发起。' },
];

const CHECK_SCENARIOS = [
  { code: 'passed', label: '检查通过', desc: '无硬拦截，展示账号权益软提醒' },
  { code: 'device_admin', label: '当前账号在企业账号中有关联设备', desc: '需先联系企业租户管理员删除您的账户', individualOnly: true },
  { code: 'locked', label: '账号处于锁定状态', desc: '账号异常，需联系客服' },
];

const SOFT_ITEMS = {
  individual: [
    ['120 积分将清零', '注销完成后积分不可恢复，也无法转移至其他账号。'],
    ['3 台普通绑定设备将解除关系', '解除后设备将转为普通设备，您当前不是设备管理员，不影响设备正常运行。'],
    ['6 条维护记录将匿名化保留', '为保障设备服务连续性，记录会去除个人标识后保留。'],
  ],
  enterprise: [
    ['120 积分将清零', '注销完成后积分不可恢复，也无法转移至其他账号。'],
    ['企业员工账户将解除关联', '解除后员工账户将被清除，无法继续登录。'],
    ['3 台普通绑定设备将解除关系', '解除后设备将转为普通设备，您当前不是设备管理员，不影响设备正常运行。'],
    ['6 条维护记录将匿名化保留', '为保障设备服务连续性，记录会去除个人标识后保留。'],
  ],
};

const HARD_BLOCK_RESULTS = {
  device_admin: [['企业租户中删除个人账号', '您关联了 2 台设备。请先联系企业租户管理员将自己的账户进行删除，完成后重新检查。', '去联系']],
  locked: [['当前账号处于锁定状态', '为保障账号安全，锁定期间不能申请注销，请联系客服核验。', '联系客服']],
};

const Ico = {
  back: () => <svg viewBox="0 0 12 20" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 2L2 10l8 8"/></svg>,
  chev: () => <svg viewBox="0 0 12 20" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 2l8 8-8 8"/></svg>,
  check: () => <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 10.6l4 4 8-9"/></svg>,
  warn: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3.2l9.1 16H2.9z"/><path d="M12 8v5.2M12 16.5v.2"/></svg>,
  user: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"><circle cx="12" cy="7" r="3.5"/><path d="M5.2 20c.5-4 3.2-6.5 6.8-6.5s6.3 2.5 6.8 6.5"/></svg>,
  gift: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"><rect x="3.5" y="8.5" width="17" height="12" rx="2"/><path d="M2.8 5.2h18.4v4.2H2.8zM12 5v15M12 5c-1.3-3.3-5.6-3.2-5.2-.5.3 1.7 3.3 1.3 5.2.5zM12 5c1.3-3.3 5.6-3.2 5.2-.5-.3 1.7-3.3 1.3-5.2.5z"/></svg>,
  link: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M10 14a4 4 0 005.6.2l2.4-2.4a4 4 0 00-5.7-5.6l-1.1 1.1"/><path d="M14 10a4 4 0 00-5.6-.2L6 12.2a4 4 0 005.7 5.6l1.1-1.1"/></svg>,
  shield: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"><path d="M12 2.8l7.2 2.8v5.6c0 4.7-2.8 8.3-7.2 10-4.4-1.7-7.2-5.3-7.2-10V5.6z"/><path d="M8.5 12l2.2 2.2 4.8-5"/></svg>,
  clock: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.3v5.2l3.4 2"/></svg>,
  close: () => <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="2.1" strokeLinecap="round"><path d="M4 4l12 12M16 4L4 16"/></svg>,
};

const StatusBar = () => (
  <div className="statusbar">
    <span className="sb-time">15:19</span>
    <span className="sb-right">
      <svg className="sb-signal" viewBox="0 0 17 11" aria-hidden="true">
        <rect x="0" y="7.5" width="2.6" height="3.5" rx="1.3"/><rect x="3.6" y="5.5" width="2.6" height="5.5" rx="1.3"/>
        <rect x="7.2" y="3.4" width="2.6" height="7.6" rx="1.3"/><rect x="10.8" y="1.4" width="2.6" height="9.6" rx="1.3"/><rect x="14.4" y="0" width="2.6" height="11" rx="1.3"/>
      </svg>
      <svg className="sb-wifi" viewBox="0 0 16 12" aria-hidden="true">
        <path d="M8 11.2l2.2-2.7a3.4 3.4 0 00-4.4 0z"/><path d="M8 5.6c1.5 0 2.9.5 4 1.4l1.4-1.7A8.6 8.6 0 008 3.3a8.6 8.6 0 00-5.4 2l1.4 1.7A6.3 6.3 0 018 5.6z"/><path d="M8 1.2c2.4 0 4.6.8 6.4 2.2L15.8 1.7A12 12 0 008-.9 12 12 0 00.2 1.7l1.4 1.7A10 10 0 018 1.2z"/>
      </svg>
      <svg className="sb-battery" viewBox="0 0 27 13" aria-hidden="true">
        <clipPath id="cancelBatClip"><rect x="0" y="0" width="25" height="13" rx="4.2"/></clipPath>
        <rect x="0" y="0" width="25" height="13" rx="4.2" fill="#D4D4D9"/><rect x="0" y="0" width="12.2" height="13" fill="#0B0B0F" clipPath="url(#cancelBatClip)"/><path d="M25.9 4.3c.9.3 1.1 1 1.1 2.2s-.2 1.9-1.1 2.2z" fill="#D4D4D9"/><text x="10.4" y="9.9" textAnchor="middle" fontSize="9.2" fontWeight="700" fill="#fff">49</text>
      </svg>
    </span>
  </div>
);

const formatDate = value => {
  const d = value ? new Date(value) : new Date();
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
};

const dateKey = value => {
  const d = value ? new Date(value) : new Date();
  const pad = n => String(n).padStart(2, '0');
  return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
};

const createRecord = status => {
  const now = new Date();
  const coolingEnd = new Date(now.getTime() + 15 * 24 * 60 * 60 * 1000);
  return {
    status: status || 'NORMAL',
    no: 'CAN-' + dateKey(now) + '-0018',
    applyTime: now.toISOString(),
    coolingEnd: coolingEnd.toISOString(),
    finishTime: status === 'CANCELLED' ? now.toISOString() : '',
    reason: '不再使用 MySANY',
    contentMode: '保留并匿名化',
  };
};

const readRecord = () => {
  try {
    const record = JSON.parse(localStorage.getItem(STORE_KEY));
    return record && VALID_STATUS.includes(record.status) ? record : createRecord('NORMAL');
  } catch (e) {
    return createRecord('NORMAL');
  }
};

const saveRecord = record => {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(record)); } catch (e) {}
};

const Header = ({ title, onBack, right, onRight }) => (
  <div className="sub-hd">
    <button className="sub-back" type="button" aria-label="返回" onClick={onBack}><Ico.back/></button>
    <div className="sub-title">{title}</div>
    <button className="sub-right" type="button" onClick={onRight}>{right || ''}</button>
  </div>
);

const FlowStep = ({ step }) => (
  <div className="flow-step"><span>{step}/4</span><i style={{ '--step': (step * 25) + '%' }}/><span>提交申请</span></div>
);

const Alert = ({ data, onClose }) => !data ? null : (
  <div className="alert-wrap">
    <div className="alert">
      <div className="alert-t">{data.title}</div>
      <p className="alert-m">{data.message}</p>
      <div className="alert-btns">
        <button className="alert-btn" onClick={() => { onClose(); data.onCancel && data.onCancel(); }}>{data.cancel || '取消'}</button>
        <button className={'alert-btn ' + (data.danger ? 'danger-text' : 'primary')} onClick={() => { onClose(); data.onOk && data.onOk(); }}>{data.ok || '确认'}</button>
      </div>
    </div>
  </div>
);

const ReasonSheet = ({ value, onPick, onClose }) => (
  <>
    <div className="scrim" onClick={onClose}/>
    <div className="sheet">
      <div className="sheet-bar"/>
      <div className="sheet-head"><button className="sheet-cancel" onClick={onClose}>取消</button><span className="sheet-title">选择注销原因</span><span className="sheet-spacer"/></div>
      <div className="sheet-body">
        {REASONS.map(item => (
          <button className={'reason-sheet-item' + (value === item.code ? ' is-on' : '')} key={item.code} onClick={() => onPick(item)}>
            {item.label}{value === item.code && <span className="pick-check"><Ico.check/></span>}
          </button>
        ))}
      </div>
    </div>
  </>
);

const CheckScenarioSheet = ({ value, onPick, onClose, tenantType }) => {
  const items = CHECK_SCENARIOS.filter(item => !item.individualOnly || tenantType === 'individual');
  return (
    <>
      <div className="scrim" onClick={onClose}/>
      <div className="sheet check-scenario-sheet">
        <div className="sheet-bar"/>
        <div className="sheet-head"><button className="sheet-cancel" onClick={onClose}>取消</button><span className="sheet-title">选择账号检查结果</span><span className="sheet-spacer"/></div>
        <p className="scenario-sheet-note">原型演示专用；正式产品将由系统自动检查，无需用户选择。</p>
        <div className="sheet-body">
          {items.map(item => (
            <button className={'scenario-sheet-item' + (value === item.code ? ' is-on' : '')} key={item.code} onClick={() => onPick(item.code)}>
              <span className={'scenario-sheet-mark' + (item.code === 'passed' ? ' pass' : '')}>{item.code === 'passed' ? <Ico.check/> : '!'}</span>
              <span className="scenario-sheet-copy"><strong>{item.label}</strong><small>{item.desc}</small></span>
              <span className="form-chev"><Ico.chev/></span>
            </button>
          ))}
        </div>
      </div>
    </>
  );
};

const TenantTypeSheet = ({ value, onPick, onClose }) => (
  <>
    <div className="scrim" onClick={onClose}/>
    <div className="sheet tenant-type-sheet">
      <div className="sheet-bar"/>
      <div className="sheet-head"><button className="sheet-cancel" onClick={onClose}>取消</button><span className="sheet-title">选择账户租户类型</span><span className="sheet-spacer"/></div>
      <p className="scenario-sheet-note">不同租户类型将展示不同的申请信息与注销影响，请按当前账户实际情况选择。</p>
      <div className="sheet-body">
        {TENANT_TYPES.map(item => (
          <button className={'scenario-sheet-item' + (value === item.code ? ' is-on' : '')} key={item.code} onClick={() => onPick(item.code)}>
            <span className={'scenario-sheet-mark' + (item.code === 'individual' ? ' pass' : '')}>{item.code === 'individual' ? <Ico.check/> : '!'}</span>
            <span className="scenario-sheet-copy"><strong>{item.label}</strong><small>{item.desc}</small></span>
            <span className="form-chev"><Ico.chev/></span>
          </button>
        ))}
      </div>
    </div>
  </>
);

function NoticePage({ form, setForm, tenantType, openReason, onAgreement, onNext, toast }) {
  const selected = REASONS.find(r => r.code === form.reason);
  const isEnterprise = tenantType === 'enterprise';
  const baseValid = form.reason && form.agreed && (form.reason !== 'OTHER' || form.desc.trim());
  const enterpriseValid = isEnterprise ? (form.phone && form.phone.length === 11 && form.tenantCode === '654321') : true;
  const valid = baseValid && enterpriseValid;
  const [seconds, setSeconds] = useState(0);
  useEffect(() => {
    if (!seconds) return;
    const id = setInterval(() => setSeconds(s => Math.max(0, s - 1)), 1000);
    return () => clearInterval(id);
  }, [seconds]);
  const sendCode = () => {
    if (seconds) return;
    if (!form.phone || form.phone.length !== 11) { toast('请先输入 11 位手机号'); return; }
    setSeconds(60);
    setForm(f => ({ ...f, tenantCode: '' }));
    toast('验证码已发送至\n租户负责人 +86 ' + form.phone.slice(0, 3) + '****' + form.phone.slice(-4) + '\n原型验证码为 654321');
  };
  return (
    <>
      <div className="cancel-scroll fade-in">
        <FlowStep step={1}/>
        <div className="cancel-hero">
          <div className="cancel-hero-top"><span className="cancel-hero-ico"><Ico.warn/></span><strong>注销账号前，请确认以下事项</strong></div>
          <p>账号注销完成后将无法登录，历史权益不会恢复。个人信息将依据适用规则删除或匿名化，依法必须保留的记录将在限定期限内安全保存。</p>
        </div>

        <section className="cancel-section">
          <div className="cancel-section-title">注销后的影响</div>
          <div className="impact-list">
            <div className="impact-row"><span className="impact-dot"><Ico.gift/></span><div className="impact-copy"><strong>积分和未使用权益将清零</strong><p>星星、积分和活动权益注销后无法找回。</p></div></div>
            <div className="impact-row"><span className="impact-dot"><Ico.link/></span><div className="impact-copy"><strong>设备及客户关系将解除</strong><p>{isEnterprise ? '企业员工账户、普通设备和客户绑定关系将解除。' : '普通设备、企业子账户和客户绑定关系将解除。'}</p></div></div>
            <div className="impact-row"><span className="impact-dot"><Ico.user/></span><div className="impact-copy"><strong>身份与认证信息将被处理</strong><p>个人资料删除或匿名化，重新注册需重新认证。</p></div></div>
            <div className="impact-row"><span className="impact-dot"><Ico.shield/></span><div className="impact-copy"><strong>必要业务记录将去标识化保留</strong><p>订单、维护、授权及审计记录按规则保存。</p></div></div>
          </div>
        </section>

        {isEnterprise && (
          <section className="cancel-section">
            <div className="tenant-verify">
              <div className="tenant-verify-tip"><span className="tenant-verify-dot">!</span><span>含企业或代理商租户的账户注销需补充租户负责人联系电话与短信验证码，确保由授权人发起本次注销。</span></div>
              <div className={'tenant-verify-card' + (form.tenantCodeError ? ' is-shake' : '')}>
                <div className="tenant-verify-row">
                  <label>负责人电话</label>
                  <input
                    className="tenant-verify-input"
                    type="tel"
                    inputMode="numeric"
                    maxLength={11}
                    value={form.phone || ''}
                    onChange={e => setForm(f => ({ ...f, phone: e.target.value.replace(/\D/g, '').slice(0, 11), tenantCode: '', tenantCodeError: '' }))}
                    placeholder="请输入 11 位手机号"
                  />
                </div>
                <div className="tenant-verify-row">
                  <label>验证码</label>
                  <input
                    className="tenant-verify-input tenant-verify-code"
                    inputMode="numeric"
                    maxLength={6}
                    value={form.tenantCode || ''}
                    onChange={e => setForm(f => ({ ...f, tenantCode: e.target.value.replace(/\D/g, '').slice(0, 6), tenantCodeError: '' }))}
                    placeholder="6 位短信验证码"
                  />
                  <button className="tenant-verify-send" type="button" disabled={seconds > 0 || !form.phone || form.phone.length !== 11} onClick={sendCode}>{seconds ? seconds + 's 后重发' : '获取验证码'}</button>
                </div>
                {form.tenantCodeError && <div className="tenant-verify-error">{form.tenantCodeError}</div>}
                {!form.tenantCodeError && form.tenantCode && form.tenantCode.length === 6 && form.tenantCode !== '654321' && (
                  <div className="tenant-verify-tip" style={{ marginTop: 10, color: '#B83B35', background: '#FFF0EF', borderColor: '#F8DAD8' }}>验证码不正确，请输入原型验证码 654321</div>
                )}
                <div className="tenant-verify-foot">原型验证码 <b>654321</b>，租户负责人真实电话以外渠道沟通核验。</div>
              </div>
            </div>
          </section>
        )}

        <section className="cancel-section">
          <div className="cancel-section-title">申请信息 <em>均为必填</em></div>
          <div className="form-card">
            <button className="form-row" onClick={openReason}>
              <label>注销原因</label><span className={'form-value' + (selected ? '' : ' is-placeholder')}>{selected ? selected.label : '请选择'}</span><span className="form-chev"><Ico.chev/></span>
            </button>
          </div>
          {(form.reason === 'OTHER' || form.reason) && (
            <><textarea className="reason-note" maxLength="200" value={form.desc} onChange={e => setForm(f => ({ ...f, desc: e.target.value }))} placeholder={form.reason === 'OTHER' ? '请填写具体原因' : '补充说明（选填）'}/><div className="text-count">{form.desc.length}/200</div></>
          )}
        </section>

        <section className="cancel-section">
          <div className="cancel-section-title">我发布的圈子内容</div>
          <button className={'choice-card' + (form.contentMode === 'ANONYMIZE' ? ' is-on' : '')} onClick={() => setForm(f => ({ ...f, contentMode: 'ANONYMIZE' }))}>
            <span className="choice-radio"/><span className="choice-text"><strong>保留并匿名化</strong><p>内容继续保留，作者统一显示为“已注销用户”。</p></span>
          </button>
          <button className={'choice-card' + (form.contentMode === 'DELETE_REQUESTED' ? ' is-on' : '')} onClick={() => setForm(f => ({ ...f, contentMode: 'DELETE_REQUESTED' }))}>
            <span className="choice-radio"/><span className="choice-text"><strong>申请删除</strong><p>提交后按适用规则审核并处理本人发布的内容。</p></span>
          </button>
        </section>

        <button className={'cancel-agree' + (form.agreed ? ' is-on' : '')} onClick={() => setForm(f => ({ ...f, agreed: !f.agreed }))}>
          <span className="agree-box"><Ico.check/></span>
          <span>我已阅读并理解 <a onClick={e => { e.stopPropagation(); onAgreement(); }}>《账号注销须知》</a>，知晓注销后的影响。</span>
        </button>
      </div>
      <div className="cancel-foot"><button className="cancel-btn" disabled={!valid} onClick={onNext}>检查账号并继续</button></div>
    </>
  );
}

const CheckingPage = () => (
  <div className="cancel-main is-white"><div className="loading-wrap fade-in"><span className="loading-ring"/><strong>正在检查账号状态</strong><p>正在确认账号权益、设备和待办事项…</p></div></div>
);

function CheckPage({ scenario, toast, onBack, onNext, tenantType }) {
  const softItems = SOFT_ITEMS[tenantType] || SOFT_ITEMS.individual;
  const blocked = scenario !== 'passed';
  const blockedItems = HARD_BLOCK_RESULTS[scenario];
  const selected = CHECK_SCENARIOS.find(item => item.code === scenario) || CHECK_SCENARIOS[0];
  const resultTitle = '暂时无法注销';
  const summaryCount = blocked ? blockedItems.length : softItems.length;
  const summaryHint = blocked ? selected.desc : (summaryCount + ' 项账号权益将在注销时处理');
  return (
    <>
      <div className="cancel-scroll fade-in">
        <FlowStep step={2}/>
        <div className="result-head">
          <span className={'result-icon' + (blocked ? ' blocked' : '')}>{blocked ? <Ico.close/> : <Ico.check/>}</span>
          <h2>{blocked ? resultTitle : '账号可以申请注销'}</h2>
          <p>{blocked ? '请先处理以下事项，完成后返回重新检查。' : '未发现阻止注销的问题，请确认以下账号权益处理结果。'}</p>
        </div>
        <div className={'check-summary' + (blocked ? ' is-blocked' : '')}>
          {blocked ? <Ico.warn/> : <Ico.shield/>}

const remainingText = end => {
  const diff = Math.max(0, new Date(end).getTime() - Date.now());
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor(diff % 86400000 / 3600000);
  const minutes = Math.floor(diff % 3600000 / 60000);
  const seconds = Math.floor(diff % 60000 / 1000);
  const pad = n => String(n).padStart(2, '0');
  return days + '天 ' + pad(hours) + ':' + pad(minutes) + ':' + pad(seconds);
};

function Timeline({ status, record }) {
  const meta = STATUS_META[status];
  const rejected = status === 'REJECTED';
  const revoked = status === 'REVOKED';
  const failed = status === 'FAILED';
  const items = [
    { title: '提交注销申请', note: 'APP 自助申请 · 账号检查完成', time: formatDate(record.applyTime), done: true },
    { title: rejected ? '审核未通过' : revoked ? '申请已撤销' : '平台审核', note: rejected ? '请查看下方驳回原因' : revoked ? '账号恢复正常状态' : status === 'PENDING' ? '正在等待处理' : (record.tenantType === 'individual' ? '个体户申请，系统自动审核通过' : '审核已通过'), time: rejected || revoked ? '已结束' : status === 'PENDING' ? '待处理' : '已完成', done: meta.progress > 1, branch: rejected || revoked, current: status === 'PENDING' },
    { title: '注销冷静期', note: status === 'COOLING' ? '截止 ' + formatDate(record.coolingEnd) : '期间可主动撤销申请', time: status === 'COOLING' ? '进行中' : meta.progress > 2 ? '已结束' : '待开始', done: meta.progress > 2, current: status === 'COOLING' },
    { title: failed ? '注销处理异常' : '注销处理', note: failed ? '平台正在处理，请勿重复申请' : '删除、匿名化及关系解绑', time: failed ? '需处理' : status === 'PROCESSING' ? '进行中' : meta.progress > 3 ? '已完成' : '待开始', done: meta.progress > 3, branch: failed, current: status === 'PROCESSING' },
    { title: '注销完成', note: '账号停止登录', time: status === 'CANCELLED' ? formatDate(record.finishTime || new Date()) : '待完成', done: status === 'CANCELLED' },
  ];
  const visible = rejected || revoked ? items.slice(0, 2) : items;
  return (
    <div className="timeline-card">
      <div className="timeline-title">申请进度</div>
      {visible.map((item, i) => <div className={'timeline-item' + (item.done ? ' done' : '') + (item.current ? ' current' : '') + (item.branch ? ' branch' : '')} key={i}><span className="timeline-dot"/><div className="timeline-copy"><strong>{item.title}</strong><p>{item.note}</p></div><span className="timeline-time">{item.time}</span></div>)}
    </div>
  );
}

function App() {
  const params = new URLSearchParams(window.location.search);
  const requested = String(params.get('state') || '').toUpperCase();
  const reset = params.get('reset') === '1';
  const initialRecordRef = useRef(null);
  if (!initialRecordRef.current) {
    if (reset) {
      initialRecordRef.current = createRecord('NORMAL');
      saveRecord(initialRecordRef.current);
    } else if (VALID_STATUS.includes(requested) && requested !== 'NORMAL') {
      initialRecordRef.current = createRecord(requested);
    } else {
      initialRecordRef.current = readRecord();
    }
  }
  const initialRecord = initialRecordRef.current;
  const initialScreen = initialRecord.status === 'NORMAL' ? 'notice' : 'detail';
  const [nav, setNav] = useState([initialScreen]);
  const [record, setRecord] = useState(initialRecord);
  const tenantParam = String(params.get('tenant') || '').toLowerCase();
  const initialTenant = tenantParam === 'enterprise' ? 'enterprise' : 'individual';
  const [tenantType, setTenantType] = useState(initialTenant);
  const [tenantTypeSheetOpen, setTenantTypeSheetOpen] = useState(initialScreen === 'notice');
  const [form, setForm] = useState({ reason: '', desc: '', contentMode: 'ANONYMIZE', agreed: false, phone: '', tenantCode: '', tenantCodeError: '' });
  const [reasonOpen, setReasonOpen] = useState(false);
  const scenarioParam = String(params.get('scenario') || '').toLowerCase();
  const initialScenario = scenarioParam === 'blocked' ? 'device_admin' : (CHECK_SCENARIOS.some(item => item.code === scenarioParam) ? scenarioParam : 'passed');
  const [checkScenario, setCheckScenario] = useState(initialScenario);
  const [checkScenarioOpen, setCheckScenarioOpen] = useState(false);
  const [dialog, setDialog] = useState(null);
  const [toastText, setToastText] = useState('');
  const [countdown, setCountdown] = useState(remainingText(initialRecord.coolingEnd));
  const toastTimer = useRef(0);
  const checkingTimer = useRef(0);
  const screen = nav[nav.length - 1];
  const reasonLabel = (REASONS.find(r => r.code === form.reason) || {}).label || '';

  const toast = (text, ms) => {
    clearTimeout(toastTimer.current); setToastText(text);
    toastTimer.current = setTimeout(() => setToastText(''), ms || 1800);
  };
  const push = page => setNav(stack => [...stack, page]);
  const replace = page => setNav(stack => [...stack.slice(0, -1), page]);
  const backToSettings = () => { window.location.href = 'mine.html?view=setting'; };
  const goBack = () => {
    if (nav.length <= 1) { backToSettings(); return; }
    setNav(stack => {
      const next = stack.slice(0, -1);
      return next[next.length - 1] === 'checking' ? next.slice(0, -1) : next;
    });
  };

  useEffect(() => () => { clearTimeout(toastTimer.current); clearTimeout(checkingTimer.current); }, []);
  useEffect(() => {
    if (record.status !== 'COOLING') return;
    setCountdown(remainingText(record.coolingEnd));
    const id = setInterval(() => setCountdown(remainingText(record.coolingEnd)), 1000);
    return () => clearInterval(id);
  }, [record.status, record.coolingEnd]);

  const startCheck = scenario => {
    setCheckScenario(scenario);
    setCheckScenarioOpen(false);
    push('checking');
    checkingTimer.current = setTimeout(() => replace('check'), 850);
  };

  const openExistingApply = () => {
    const existing = createRecord('PENDING');
    existing.reason = '不再使用 MySANY';
    existing.contentMode = '保留并匿名化';
    existing.tenantType = 'enterprise';
    existing.tenantTypeLabel = '含企业租户或代理商租户';
    saveRecord(existing); setRecord(existing); setNav(['detail']);
  };

  const submit = () => {
    const tInfo = TENANT_TYPES.find(t => t.code === tenantType) || TENANT_TYPES[0];
    setDialog({
      title: '确认提交注销申请？',

        ? '租户类型：含企业/代理商租户。提交后平台将进行人工审核；审核通过后进入 15 天冷静期，期间您仍可撤销申请。'
        : '租户类型：仅为个体租户。提交后系统将自动审核通过，直接进入 15 天冷静期，期间您仍可撤销申请。',

        const autoApproved = tenantType === 'individual';
        const next = createRecord(autoApproved ? 'COOLING' : 'PENDING');
        next.reason = reasonLabel;
        next.reasonDesc = form.desc;
        next.contentMode = form.contentMode === 'ANONYMIZE' ? '保留并匿名化' : '申请删除';
        next.tenantType = tenantType;
        next.tenantTypeLabel = tInfo.label;
        if (autoApproved) {
          next.auditTime = new Date().toISOString();
          next.auditOpinion = '个体户申请，系统自动审核通过，直接进入冷静期';
        }
        if (tenantType === 'enterprise') {
          next.tenantContact = form.phone ? '+86 ' + form.phone.slice(0, 3) + '****' + form.phone.slice(-4) : '';
          next.tenantCodeVerified = form.tenantCode === '654321';
        }
        saveRecord(next); setRecord(next); setNav(['success']);
      },
    });

    title: '确认撤销注销申请？',
    message: '撤销后本次注销流程将终止，账号继续正常使用。如仍需注销，可以重新提交申请。',
    cancel: '继续注销', ok: '确认撤销', danger: true,
    onOk: () => {
      const next = { ...record, status: 'REVOKED', revokeTime: new Date().toISOString() };
      saveRecord(next); setRecord(next); toast('注销申请已撤销');
    },
  });

  const reapply = () => {
    const next = createRecord('NORMAL'); saveRecord(next); setRecord(next);
    setForm({ reason: '', desc: '', contentMode: 'ANONYMIZE', agreed: false, phone: '', tenantCode: '', tenantCodeError: '' });
    setNav(['notice']);
    setTenantType(initialTenant);
    setTenantTypeSheetOpen(true);
  };

  const pickTenantType = code => {
    setTenantType(code);
    setTenantTypeSheetOpen(false);
    if (code === 'enterprise') {
      setForm(f => ({ ...f, phone: f.phone || '', tenantCode: '' }));
    }
  };

  const title = screen === 'agreement' ? '账号注销须知' : screen === 'check' ? '账号检查' : screen === 'verify' ? '验证身份' : screen === 'confirm' ? '确认申请' : '注销申请';
  const showService = screen === 'detail' && ['REJECTED', 'PROCESSING', 'FAILED'].includes(record.status);

  return (
    <div className="stage">
      <div className="device">
        <StatusBar/>
        <div className="cancel-app">
          <Header title={title} onBack={screen === 'checking' ? () => {} : goBack} right={showService ? '客服' : ''} onRight={() => toast('拨打 0086-4006098318')}/>
          <main className={'cancel-main' + (screen === 'success' || screen === 'checking' || screen === 'agreement' ? ' is-white' : '')}>
            {screen === 'notice' && <NoticePage form={form} setForm={setForm} tenantType={tenantType} openReason={() => setReasonOpen(true)} onAgreement={() => push('agreement')} onNext={() => setCheckScenarioOpen(true)} toast={toast}/>}
            {screen === 'checking' && <CheckingPage/>}
            {screen === 'check' && <CheckPage scenario={checkScenario} toast={toast} onBack={goBack} onNext={() => push('verify')} tenantType={tenantType}/>}
            {screen === 'verify' && <VerifyPage toast={toast} onNext={() => push('confirm')}/>}
            {screen === 'confirm' && <ConfirmPage form={form} reasonLabel={reasonLabel} tenantType={tenantType} tenantContact={tenantType === 'enterprise' && form.phone ? '+86 ' + form.phone.slice(0, 3) + '****' + form.phone.slice(-4) : ''} onSubmit={submit}/>}
            {screen === 'success' && <SuccessPage record={record} onDetail={() => setNav(['detail'])} onBack={backToSettings}/>}
            {screen === 'detail' && <DetailPage status={record.status} record={record} countdown={countdown} onWithdraw={withdraw} onReapply={reapply} onContact={() => toast('拨打 0086-4006098318')} onLogin={() => { window.location.href = 'index.html'; }}/>}
            {screen === 'agreement' && <AgreementPage/>}
          </main>
        </div>

        {reasonOpen && <ReasonSheet value={form.reason} onClose={() => setReasonOpen(false)} onPick={item => { setForm(f => ({ ...f, reason: item.code })); setReasonOpen(false); }}/>}
        {checkScenarioOpen && <CheckScenarioSheet value={checkScenario} onClose={() => setCheckScenarioOpen(false)} onPick={startCheck} tenantType={tenantType}/>}
        {tenantTypeSheetOpen && <TenantTypeSheet value={tenantType} onClose={() => setTenantTypeSheetOpen(false)} onPick={pickTenantType}/>}
        <Alert data={dialog} onClose={() => setDialog(null)}/>
        {toastText && <div className="toast">{toastText}</div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
