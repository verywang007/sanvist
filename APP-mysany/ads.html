<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C9CCD4">
<title>MySANY · 个性化广告授权</title>
<link rel="stylesheet" href="assets/mine.css">
<style>
/* =========================================================
   启动页 + 系统授权弹窗（对照真机截图还原）
   ========================================================= */
.device{ background:#C9CCD4; }

/* ── 启动页背景（天际线 + SANY 挖掘机）───────────────── */
.splash{ position:absolute; inset:0; z-index:0; }
.splash svg{ display:block; width:100%; height:100%; }
.veil{                     /* 系统弹窗出现时的整体压暗 / 去色 */
  position:absolute; inset:0; z-index:4; pointer-events:none;
  background:rgba(186,192,203,.26);
  -webkit-backdrop-filter:saturate(.55); backdrop-filter:saturate(.55);
}

/* ── 顶部状态栏（含灵动岛 / 返回 App Store）─────────── */
.sbar{
  position:absolute; top:0; left:0; right:0; height:64px; z-index:6;
  display:flex; align-items:flex-start; justify-content:space-between;
  padding:9px 22px 0; color:#0B0B0F;
}
.sbar-l{ display:flex; flex-direction:column; gap:1px; }
.sbar-time{ font-size:16px; font-weight:600; letter-spacing:-.2px; line-height:1.15; }
.sbar-back{ display:flex; align-items:center; gap:4px; font-size:13px; line-height:1.2; }
.sbar-back svg{ width:8px; height:11px; fill:#0B0B0F; }
.sbar-r{ display:flex; align-items:center; gap:6px; padding-top:3px; }
.sbar-r .sb-signal{ width:17px; height:11px; fill:#0B0B0F; }
.sbar-r .sb-wifi{ width:16px; height:12px; fill:#0B0B0F; }
.sbar-r .sb-battery{ width:27px; height:13px; }

.island{
  position:absolute; top:9px; left:50%; transform:translateX(-50%);
  width:141px; height:46px; border-radius:23px; background:#000;
  display:flex; align-items:center; justify-content:center; gap:7px;
}
.island .il-app{ width:29px; height:29px; border-radius:8px; background:#F0642E;
                 box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); }
.island .il-app i{ display:block; width:11px; height:11px; margin:9px auto 0;
                   background:#fff; opacity:.85;
                   clip-path:polygon(50% 0,100% 100%,0 100%); }
.island .il-pic{ width:25px; height:29px; border-radius:6px;
                 background:linear-gradient(160deg,#6C727E,#3A3E46); }

/* ── 分页圆点 ─────────────────────────────────────────── */
.dots{
  position:absolute; left:50%; bottom:74px; transform:translateX(-50%); z-index:5;
  display:flex; gap:16px;
}
.dots i{ width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.95); }
.dots i + i{ background:rgba(255,255,255,.45); }

/* ── 授权弹窗 ─────────────────────────────────────────── */
.alert-wrap{ background:none; padding-top:36px; }
.device .alert{
  width:300px; padding:21px 20px 16px; text-align:left;
  background:rgba(242,243,246,.94);
  border-radius:26px;
  box-shadow:0 14px 44px rgba(10,12,20,.20), 0 1px 2px rgba(10,12,20,.08);
}
.device .alert-t{ font-size:17.5px; line-height:1.34; }
.device .alert-m{ margin-top:8px; font-size:15px; color:#33343A; line-height:1.42; }
.device .alert-btns{ gap:10px; margin-top:18px; }
.device .alert-btn{ height:50px; border-radius:16px; background:#E2E3E7; font-size:17px; }
.device .alert-btn:active{ background:#D6D7DC; }
</style>
</head>
<body>

<div id="root"></div>

<!-- React 18 + Babel 7 已内置在 assets/vendor，双击本文件即可离线运行 -->
<script src="assets/vendor/react.production.min.js"></script>
<script src="assets/vendor/react-dom.production.min.js"></script>
<script src="assets/vendor/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* 弹窗文案（需求原文） */
const ADS_ALERT = {
  t: '“MySANY”个性化广告',
  m: '关闭个性化广告将限制sanvist向你推送相关广告的能力，但不会减少你收到的广告数量。',
  cancel: '不允许',
  ok: '允许',
};

/* =========================================================
   启动页背景：城市天际线 + 黄色 SANY 挖掘机（手绘 SVG）
   ========================================================= */
const Skyline = () => (
  <div className="splash">
    <svg viewBox="0 0 414 896" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"   stopColor="#A7AFBE"/>
          <stop offset=".62" stopColor="#BCC2CD"/>
          <stop offset="1"   stopColor="#C6CAD3"/>
        </linearGradient>
        <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor="#C9CCD4" stopOpacity="0"/>
          <stop offset="1" stopColor="#C9CCD4" stopOpacity=".92"/>
        </linearGradient>
      </defs>

      {/* 地面 / 下半屏底色 */}
      <rect width="414" height="896" fill="#C9CCD4"/>
      {/* 天空 */}
      <rect width="414" height="422" fill="url(#sky)"/>

      {/* 远层楼群 */}
      <g fill="#B0B7C5" opacity=".7">
        <rect x="-6" y="288" width="44" height="134"/>
        <rect x="120" y="254" width="22" height="168"/>
        <rect x="150" y="302" width="34" height="120"/>
        <rect x="246" y="270" width="24" height="152"/>
        <rect x="288" y="242" width="26" height="180"/>
        <rect x="358" y="274" width="30" height="148"/>
        <rect x="394" y="302" width="30" height="120"/>
      </g>

      {/* 主层楼群 */}
      <g fill="#99A1B0">
        <rect x="-10" y="318" width="46" height="104"/>
        <rect x="30" y="350" width="24" height="72"/>
        <rect x="56" y="254" width="30" height="168" rx="15"/>
        <rect x="90" y="294" width="16" height="128"/>
        <rect x="110" y="232" width="10" height="190"/>
        <rect x="124" y="324" width="28" height="98"/>
        <rect x="156" y="370" width="34" height="52"/>
      </g>

      {/* 中央塔尖（哈利法塔形） */}
      <path d="M190 422 L198 264 L202 198 L206 132 L209 68 L212 -24 L216 -24 L219 68
               L222 132 L226 198 L230 264 L238 422 Z" fill="#A4ACBA"/>

      {/* 右侧楼群 + 帆形塔 */}
      <g fill="#99A1B0">
        <rect x="252" y="308" width="28" height="114"/>
        <rect x="278" y="234" width="18" height="188"/>
        <rect x="296" y="274" width="30" height="148"/>
        <path d="M330 422 V240 c0-13 42-13 42 0 V422 Z"/>
        <rect x="378" y="294" width="18" height="128"/>
        <rect x="396" y="326" width="26" height="96"/>
      </g>

      {/* 楼群根部雾化，与下半屏接续 */}
      <rect x="0" y="360" width="414" height="62" fill="url(#fog)"/>

      {/* ── SANY 挖掘机 ─────────────────────────────── */}
      <g>
        {/* 履带 */}
        <rect x="178" y="396" width="98" height="22" rx="11" fill="#24262B"/>
        <rect x="184" y="402" width="86" height="10" rx="5"  fill="#34373D"/>
        <circle cx="187" cy="407" r="7"   fill="#3A3D43"/>
        <circle cx="199" cy="407" r="6.4" fill="#4A4E55"/>
        <circle cx="226" cy="407" r="6.4" fill="#4A4E55"/>
        <circle cx="253" cy="407" r="6.4" fill="#4A4E55"/>
        <circle cx="270" cy="407" r="6.4" fill="#4A4E55"/>

        {/* 上部车身 */}
        <rect x="178" y="358" width="94" height="40" rx="5" fill="#F2C21B"/>
        <rect x="176" y="362" width="14" height="32" rx="3" fill="#DFAF13"/>
        <rect x="196" y="380" width="38" height="5"  rx="2.5" fill="#2A2D33" opacity=".75"/>
        <rect x="196" y="366" width="26" height="4"  rx="2"   fill="#D9AB12" opacity=".9"/>

        {/* 驾驶室 */}
        <rect x="238" y="348" width="36" height="50" rx="4" fill="#F2C21B"/>
        <path d="M245 354 H265 L273 371 V394 H245 Z" fill="#2B2E34"/>
        <path d="M248 357 H262 L268 370 V391 H248 Z" fill="#3E444C" opacity=".55"/>

        {/* 大臂 + 油缸 */}
        <path d="M242 374 L292 300 L308 314 L258 388 Z" fill="#F2C21B"/>
        <path d="M242 374 L292 300 L298 307 L248 381 Z" fill="#FFD84A" opacity=".55"/>
        <line x1="252" y1="374" x2="286" y2="341" stroke="#4E5259" strokeWidth="4.5" strokeLinecap="round"/>

        {/* 小臂 + 油缸 */}
        <path d="M288 292 L304 284 L332 346 L316 354 Z" fill="#E6B512"/>
        <line x1="296" y1="310" x2="322" y2="350" stroke="#4E5259" strokeWidth="4.5" strokeLinecap="round"/>

        {/* 铲斗 */}
        <path d="M313 340 L338 334 L349 370 L330 385 L314 364 Z" fill="#2A2D33"/>
        <path d="M330 385 L332 392 L337 386 Z M322 381 L323 388 L328 382 Z" fill="#2A2D33"/>

        {/* 大臂上的 SANY 字样 */}
        <text x="265" y="352" fill="#E23B2E" fontSize="13.5" fontWeight="800"
              letterSpacing="1" transform="rotate(-40 265 352)">SANY</text>
      </g>
    </svg>
    <div className="veil"/>
  </div>
);

/* =========================================================
   页面
   ========================================================= */
function App() {
  const [dialog, setDialog] = useState(ADS_ALERT);
  const [msg, setMsg] = useState('');
  const timer = useRef(0);
  const re = useRef(0);

  const toast = useCallback(t => {
    setMsg(t);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setMsg(''), 1600);
  }, []);
  useEffect(() => () => { clearTimeout(timer.current); clearTimeout(re.current); }, []);

  /* 选择后关闭，稍后重新弹出，便于反复演示 */
  const choose = ok => {
    setDialog(null);
    toast(ok ? '已开启个性化广告' : '已关闭个性化广告\n广告数量不会因此减少');
    re.current = setTimeout(() => setDialog(ADS_ALERT), 1400);
  };

  return (
    <div className="stage">
      <div className="device">

        <Skyline/>

        {/* 状态栏 */}
        <div className="sbar">
          <div className="sbar-l">
            <span className="sbar-time">11:45</span>
            <span className="sbar-back">
              <svg viewBox="0 0 8 11" aria-hidden="true"><path d="M7.6 0L0 5.5l7.6 5.5z"/></svg>
              App Store
            </span>
          </div>
          <div className="sbar-r">
            <svg className="sb-signal" viewBox="0 0 17 11" aria-hidden="true">
              <rect x="0"    y="7.5" width="2.6" height="3.5" rx="1.3"/>
              <rect x="3.6"  y="5.5" width="2.6" height="5.5" rx="1.3"/>
              <rect x="7.2"  y="3.4" width="2.6" height="7.6" rx="1.3"/>
              <rect x="10.8" y="1.4" width="2.6" height="9.6" rx="1.3"/>
              <rect x="14.4" y="0"   width="2.6" height="11"  rx="1.3"/>
            </svg>
            <svg className="sb-wifi" viewBox="0 0 16 12" aria-hidden="true">
              <path d="M8 11.2l2.2-2.7a3.4 3.4 0 00-4.4 0z"/>
              <path d="M8 5.6c1.5 0 2.9.5 4 1.4l1.4-1.7A8.6 8.6 0 008 3.3a8.6 8.6 0 00-5.4 2l1.4 1.7A6.3 6.3 0 018 5.6z"/>
              <path d="M8 1.2c2.4 0 4.6.8 6.4 2.2L15.8 1.7A12 12 0 008 -.9 12 12 0 00.2 1.7l1.4 1.7A10 10 0 018 1.2z"/>
            </svg>
            <svg className="sb-battery" viewBox="0 0 27 13" aria-hidden="true">
              <clipPath id="batClip"><rect x="0" y="0" width="25" height="13" rx="4.2"/></clipPath>
              <rect x="0" y="0" width="25" height="13" rx="4.2" fill="#D4D4D9"/>
              <rect x="0" y="0" width="9" height="13" fill="#0B0B0F" clipPath="url(#batClip)"/>
              <path d="M25.9 4.3c.9.3 1.1 1 1.1 2.2s-.2 1.9-1.1 2.2z" fill="#D4D4D9"/>
              <text x="10.4" y="9.9" textAnchor="middle" fontSize="9.2" fontWeight="700" fill="#fff">36</text>
            </svg>
          </div>

          {/* 灵动岛 */}
          <div className="island">
            <span className="il-app"><i/></span>
            <span className="il-pic"/>
          </div>
        </div>

        {/* 分页圆点 */}
        <div className="dots"><i/><i/></div>

        {/* 系统授权弹窗 */}
        {dialog && (
          <div className="alert-wrap">
            <div className="alert">
              <div className="alert-t">{dialog.t}</div>
              <p className="alert-m">{dialog.m}</p>
              <div className="alert-btns">
                <button className="alert-btn"         onClick={() => choose(false)}>{dialog.cancel}</button>
                <button className="alert-btn primary" onClick={() => choose(true)}>{dialog.ok}</button>
              </div>
            </div>
          </div>
        )}

        {msg && <div className="toast">{msg}</div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
