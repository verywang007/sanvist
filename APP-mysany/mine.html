const COOKIE_STORE_KEY = 'mysany.cookieConsent.v1';
const COOKIE_SCHEMA_VERSION = '1.0';
const COOKIE_DEFAULTS = { necessary: true, functional: false, analytics: false, marketing: false };

const CANCEL_STORE_KEY = 'mysany.cancelPrototype.v1';
const cancelStatusSummary = () => {
  try {
    const record = JSON.parse(localStorage.getItem(CANCEL_STORE_KEY));
    return {
      PENDING: '待审核', COOLING: '冷静期', PROCESSING: '注销中', FAILED: '处理异常',
      REJECTED: '上次申请已驳回', REVOKED: '上次申请已撤销', CANCELLED: '已注销',
    }[record && record.status] || '';
  } catch (e) {
    return '';
  }
};

const readCookieConsent = () => {
  try {
    const record = JSON.parse(localStorage.getItem(COOKIE_STORE_KEY));
    return record && record.choices ? { ...COOKIE_DEFAULTS, ...record.choices } : { ...COOKIE_DEFAULTS };
  } catch (e) {
    return { ...COOKIE_DEFAULTS };
  }
};

const saveCookieConsent = (choices, action = 'settings_update') => {
  const record = {
    schemaVersion: COOKIE_SCHEMA_VERSION,
    policyVersion: '2026.09',
    vendorListVersion: '1.0',
    region: 'EEA',
    action,
    choices: { ...COOKIE_DEFAULTS, ...choices },
    timestamp: new Date().toISOString(),
  };
  try { localStorage.setItem(COOKIE_STORE_KEY, JSON.stringify(record)); } catch (e) {}
  return record.choices;
};

const cookieSummary = choices => {
  const count = ['functional', 'analytics', 'marketing'].filter(k => choices && choices[k]).length;
  if (count === 0) return '仅必要';
  if (count === 3) return '全部允许';
  return '已允许 ' + count + ' 类';
};

            <div className="sub-foot">
              <button className="btn-primary" onClick={() => {
                if (sn.trim().length < 6) return toast('请输入完整的设备出厂编号');
                toast('已提交绑定申请\n等待机主确认'); onBack();
              }}>提交绑定</button>
            </div>
          </>
        );

      case 'warn':
        return (
          <>
            <div className="list" style={{ marginTop: 12 }}>
              {WARNINGS.map((w, i) => (
                <div className="warn" key={i} onClick={() => toast('查看告警详情：\n' + w.t)}>
                  <span className="warn-dot" style={{ background: w.c }}/>
                  <div className="warn-b">
                    <div className="warn-t">{w.t}</div>
                    <div className="warn-d">{w.d}</div>
                  </div>
                  <span className="warn-lv" style={{ color: w.c, background: w.bg }}>{w.lv}</span>
                </div>
              ))}
            </div>
            <p className="sub-note">共 3 条未处理告警，超过 48 小时未处理将自动升级为服务工单。</p>
          </>

        return (
          <>
            <div className="card" style={{ marginTop: 12 }}>
              <div className="card-title">本月机群概览</div>
              <div className="stats">
                <div className="stat"><span className="stat-num">4</span><span className="stat-lbl">在管设备</span></div>
                <div className="stat"><span className="stat-num">312</span><span className="stat-lbl">作业小时</span></div>
                <div className="stat"><span className="stat-num">52%</span><span className="stat-lbl">平均利用率</span></div>
              </div>
            </div>
            <div className="list bars" style={{ marginTop: 10 }}>
              {FLEET.map((f, i) => (
                <div className="bar-row" key={i}>
                  <div className="bar-top"><span>{f.n}</span><b>{f.v}%</b></div>
                  <div className="bar-track"><div className="bar-fill" style={{ width: f.v + '%', background: f.c }}/></div>
                </div>
              ))}
            </div>
            <p className="sub-note">利用率 = 当月实际作业小时 / 可作业小时，数据每日 06:00 更新。</p>
          </>
        );

      case 'mall':
        return (
          <>
            <div className="card" style={{ marginTop: 12, display: 'flex', alignItems: 'center' }}>
              <div>
                <div style={{ fontSize: 13, color: '#8A8C93' }}>可用积分</div>
                <div style={{ fontSize: 26, fontWeight: 700, color: '#FF7A18', marginTop: 2 }}>2,860</div>
              </div>
              <button className="star-view" style={{ marginLeft: 'auto' }} onClick={() => toast('积分明细')}>
                积分明细 <Ico.chev/>
              </button>
            </div>
            <div className="goods">
              {GOODS.map((g, i) => (
                <div className="good" key={i} onClick={() => toast(g.p > 2860 ? '积分不足，还差 ' + (g.p - 2860) + ' 分' : '已加入兑换单：\n' + g.n)}>
                  <div className="good-img"><Ico.gift/></div>
                  <div className="good-n">{g.n}</div>
                  <div className="good-p">{fmtRp(g.p)}<span>积分</span></div>
                </div>
              ))}
            </div>
          </>
        );

      case 'addr':
        return (
          <>
            <div className="list" style={{ marginTop: 12 }}>
              {ADDRS.map((a, i) => (
                <div className="addr" key={i} onClick={() => toast('编辑收货地址')}>
                  <div className="addr-h">
                    <span>{a.n}</span><span style={{ color: '#8A8C93', fontSize: 13 }}>{a.p}</span>
                    {a.def && <span className="tag">默认</span>}
                  </div>
                  <p className="addr-p">{a.a}</p>
                </div>
              ))}
            </div>
            <div style={{ flex: 1 }}/>
            <div className="sub-foot">
              <button className="btn-primary" onClick={() => toast('新增收货地址')}>+ 新增地址</button>
            </div>
          </>
        );

      case 'feedback':
        return (
          <>
            <div className="card" style={{ marginTop: 12 }}>
              <div className="card-title">问题描述</div>
              <textarea className="ta" value={fb} onChange={e => setFb(e.target.value)} maxLength={200}
                        placeholder="请描述你遇到的问题或建议，我们会在 1 个工作日内回复"/>
              <div style={{ textAlign: 'right', fontSize: 12, color: '#B4B7BE' }}>{fb.length}/200</div>
            </div>
            <div style={{ flex: 1 }}/>
            <div className="sub-foot">
              <button className="btn-primary" onClick={() => {
                if (!fb.trim()) return toast('请先填写问题描述');
                toast('反馈已提交，感谢你的建议'); onBack();
              }}>提交反馈</button>
            </div>
          </>
        );

      case 'self':
        return (
          <>
            <div className="card" style={{ marginTop: 12 }}>
              <div className="kf">
                {[['保养预约', <Ico.cog/>], ['配件查询', <Ico.box/>], ['电子保单', <Ico.doc/>]].map(([t, ic], i) => (
                  <div className="kf-item" key={i} onClick={() => toast(t)}>{ic}<span>{t}</span></div>
                ))}
              </div>
              <div className="kf">
                {[['发票申请', <Ico.mail/>], ['进度查询', <Ico.chart/>], ['服务网点', <Ico.pin/>]].map(([t, ic], i) => (
                  <div className="kf-item" key={i} onClick={() => toast(t)}>{ic}<span>{t}</span></div>
                ))}
              </div>
            </div>
            <p className="sub-note">自助服务 7×24 小时可用，复杂问题可转人工客服 400-887-8318。</p>
          </>
        );

      default:
        return <Empty txt={view.empty || '暂无数据'} sub={view.sub}/>;
    }
  };

  return (
    <div className={'subpage' + (view.white ? ' is-white' : '')}>
      <div className={'sub-hd' + (view.left ? ' is-left' : '')}>
        <button className="sub-back" onClick={onBack} aria-label="返回"><Ico.back/></button>
        <span className="sub-title">{view.t}</span>
        {!view.left && <span className="sub-right">{view.right || ''}</span>}
      </div>
      <div className={'scroll' + (view.k === 'cookies' ? ' cookie-settings-scroll' : '')}
           style={{ display: 'flex', flexDirection: 'column' }}>{body()}</div>
    </div>
  );
}

  return (
    <>
      {/* 顶部账号栏（吸顶） */}

          <Avatar size={40} set={profile.avatar} name={acc.name}/>
          <span className="hd-badge">!</span>

        <div className="hd-main">
          <div className="hd-line">
            <span className="hd-name" onClick={() => push('profile')}>{acc.name}</span>
            <button className="hd-swap" onClick={() => openSheet('account')} aria-label="切换身份"><Ico.swap/></button>
          </div>
          <span className="hd-tag">{acc.tag}</span>
        </div>
        <div className="hd-acts">
          <button onClick={() => openSheet('service')} aria-label="客服"><Ico.headset/></button>

            <button className="star-view" onClick={() => openSheet('star')}>立即查看 <Ico.chev/></button>
          </div>
          <div className="star-sum">
            我的星星 <em>{stars}</em> ≈ <span className="rp">Rp </span><em>{fmtRp(stars * 100)},-</em>

          <div className="week">

              <div key={i} className={'day' + (d.on ? ' is-on' : '') + (d.today ? ' is-today' : '') + (d.pop ? ' pop' : '')}

        {/* 三宫格 */}

            { k: 'warn',   t: '设备预警', ico: <Ico.beacon/>, bg: '#FFF2E4' },

        {/* 业务列表 */}

          {ROWS_1.map(r => (

              <span className="row-txt">{r.t}</span>
              <span className="row-chev"><Ico.chev/></span>

          ))}

        {/* 服务列表 */}

          {ROWS_2.map(r => (
            <div className="row" key={r.k} onClick={() => push(r.k)}>
              <span className="row-ico" style={{ background: r.bg }}>{r.ico}</span>
              <span className="row-txt">{r.t}</span>

const SUBS = {
  bind:     { k: 'bind',     t: '绑定设备' },
  warn:     { k: 'warn',     t: '设备预警', right: '3 条' },

  privacy:  { k: 'privacy',  t: '隐私协议' },
  terms:    { k: 'terms',    t: '用户服务协议' },
  mall:     { k: 'mall',     t: '积分商城' },
  self:     { k: 'self',     t: '自助服务' },
  fav:      { k: 'fav',      t: '收藏中心',   empty: '还没有收藏内容', sub: '长按机型或资讯即可收藏' },
  feedback: { k: 'feedback', t: 'APP反馈' },

};

const PROFILE_INIT = {
  avatar: false,               // 是否已设置头像
  country: '中国',
  role: '设备操作手',
  phone: '133****2180',
  email: '8*********@qq.com',
};

function App() {
  const [tab, setTab] = useState('me');
  const [accs, setAccs] = useState(ACCOUNTS);
  const [profile, setProfile] = useState(PROFILE_INIT);
  const [dialog, setDialog] = useState(null);   // 系统弹窗 / 二次确认
  const [settings, setSettings] = useState(() => {
    const cookies = readCookieConsent();
    return { lang: '跟随系统', push: true, ads: cookies.marketing, force: true, cookies };
  });
  const [accId, setAccId] = useState('a1');
  const [week, setWeek] = useState(WEEK_INIT);
  const [stars, setStars] = useState(0);
  const [claimed, setClaimed] = useState(false);
  const [sheet, setSheet] = useState(null);
  const [stack, setStack] = useState(() => {
    const direct = new URLSearchParams(window.location.search).get('view');
    return direct && SUBS[direct] ? [SUBS[direct]] : [];
  });                                           // 二级页导航栈；支持原型直达 ?view=cookies
  const [msg, setMsg] = useState('');
  const timer = useRef(0);
  const sub = stack[stack.length - 1];

  const acc = accs.find(a => a.id === accId);

  const toast = useCallback((t, ms) => {
    setMsg(t);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setMsg(''), ms || 1800);
  }, []);

  useEffect(() => () => clearTimeout(timer.current), []);

  /* 一键领取：数字滚动 + 星星弹跳 */
  const claim = n => {
    setClaimed(true);
    setWeek(w => w.map(d => d.on ? { ...d, pop: true } : d));
    let i = 0;
    const id = setInterval(() => {
      i += 1;
      setStars(i);
      if (i >= n) { clearInterval(id); toast('领取成功，获得 ' + n + ' 颗星星'); }
    }, 70);
    setTimeout(() => setWeek(w => w.map(d => ({ ...d, pop: false }))), 600);
  };

  /* 更换头像：相机先走系统权限授权，相册直接进隐私确认 */
  const askPhoto = from => {
    if (from !== '相机') return askAvatarPrivacy(from);
    setDialog({
      perm: true,
      dark: true,                      // 相机场景弹窗浮在取景黑屏上
      icon: 'cam',
      t: '允许“MySANY”访问相机？',
      m: '“MySANY”想访问您的相机,为了帮您实现扫描二维码,设置头像等功能',
      cancel: '不允许',
      ok: '允许',
      onCancel: () => toast('已拒绝授权\n无法使用相机更换头像'),
      onOk: () => askAvatarPrivacy(from),
    });
  };

  /* 更换头像：第 2 步 — 头像隐私确认 */
  const askAvatarPrivacy = from => setDialog({
    t: '头像使用说明',
    m: '仅用于账号身份识别、内部同事识别。',
    cancel: '取消',
    ok: '同意',
    onCancel: () => toast('已取消更换头像'),
    onOk: () => {
      setProfile(p => ({ ...p, avatar: true }));
      toast(from === '相机' ? '拍照完成，头像已更新' : '已选择图片，头像已更新');
    },
  });

  const push = k => SUBS[k] ? setStack(s => [...s, SUBS[k]]) : toast('功能开发中');
  const back = () => setStack(s => s.slice(0, -1));
  const confirm = d => setDialog({ cancel: '取消', ...d });

  return (
    <div className="stage">
      <div className="device">
        <StatusBar/>

        <div className="screen">
          {tab === 'me' && (
            <MinePage acc={acc} profile={profile} stars={stars} week={week} claimed={claimed}
                      onClaim={claim} toast={toast} push={push} openSheet={setSheet}/>
          )}
          {tab === 'home'   && <PlainPage title="首页"   txt="首页内容仅在完整版中展示" sub="本原型聚焦「我的」页交互"/>}
          {tab === 'device' && <PlainPage title="设备"   txt="还没有绑定任何设备" sub="回到「我的」页点击绑定设备"/>}
          {tab === 'audit'  && <PlainPage title="审核"   txt="暂无待审核事项" sub="成员申请、用车审批会在此汇总"/>}

          {/* 右侧悬浮球 */}
          {tab === 'me' && (
            <button className="fab" onClick={() => openFab(toast)} aria-label="快捷入口">
              <Ico.grid/>
            </button>
          )}

        </div>

        {/* 底部 Tab */}
        <div className="tabbar">
          {[
            { k: 'home',   t: '首页', i: Ico.tHome },
            { k: 'device', t: '设备', i: Ico.tDevice },
            { k: 'audit',  t: '审核', i: Ico.tAudit },
            { k: 'me',     t: '我',   i: Ico.tMe },
          ].map(t => (
            <button key={t.k} className={'tabitem' + (tab === t.k ? ' is-active' : '')}
                    onClick={() => {
                      if (t.k === 'home') { window.location.href = 'home.html'; return; }
                      setStack([]); setTab(t.k);
                    }}>
              {t.i(tab === t.k)}
              <span>{t.t}</span>
            </button>
          ))}
        </div>

        {/* 二级页：覆盖底部 Tab 的全屏页，支持多级返回 */}
        {sub && <SubPage key={stack.length} view={sub} onBack={back} toast={toast}
                         acc={acc} profile={profile} openSheet={setSheet}
                         settings={settings} setSettings={setSettings} push={push} confirm={confirm}/>}

        {/* ── 头像来源：相机 / 相册 / 取消 ── */}
        {sheet === 'avatar' && (
          <>
            <div className="scrim" onClick={() => setSheet(null)}/>
            <div className="as">
              <div className="as-group">
                <button className="as-item" onClick={() => { setSheet(null); askPhoto('相机'); }}>相机</button>
                <button className="as-item" onClick={() => { setSheet(null); askPhoto('相册'); }}>相册</button>
              </div>
              <div className="as-group as-cancel">
                <button className="as-item" onClick={() => setSheet(null)}>取消</button>
              </div>
            </div>
          </>
        )}

        {/* ── 系统弹窗：授权 / 二次确认 ── */}
        {dialog && (
          <div className={'alert-wrap' + (dialog.dark ? ' is-dark' : '')}>
            <div key={dialog.t} className={'alert' + (dialog.perm ? ' is-perm' : '') + (dialog.dark ? ' is-dark' : '')}>
              {dialog.icon && <PermIcon kind={dialog.icon}/>}
              <div className="alert-t">{dialog.t}</div>
              <p className="alert-m">{dialog.m}</p>
              <div className="alert-btns">
                <button className="alert-btn" onClick={() => { setDialog(null); dialog.onCancel && dialog.onCancel(); }}>
                  {dialog.cancel}
                </button>
                <button className="alert-btn primary" onClick={() => { setDialog(null); dialog.onOk && dialog.onOk(); }}>
                  {dialog.ok}
                </button>
              </div>
            </div>
          </div>
        )}

        {/* ── 个人信息编辑 ── */}
        {sheet === 'nickname' && (
          <NameSheet name={acc.name} onClose={() => setSheet(null)}
                     onSave={n => { setAccs(as => as.map(a => a.id === accId ? { ...a, name: n } : a)); setSheet(null); toast('昵称已更新'); }}/>
        )}
        {sheet === 'role' && (
          <PickSheet title="选择身份" options={['设备操作手', '机主', '车队管理员', '服务工程师']} value={profile.role}
                     onClose={() => setSheet(null)}
                     onPick={v => { setProfile(p => ({ ...p, role: v })); setSheet(null); toast('身份已提交审核\n当前显示为' + v); }}/>
        )}

        {/* ── 弹层 ── */}
        {sheet === 'account' && (
          <Sheet title="切换身份" onClose={() => setSheet(null)}>
            {ACCOUNTS.map(a => (
              <div key={a.id} className={'acc' + (a.id === accId ? ' is-on' : '')}
                   onClick={() => { setAccId(a.id); setSheet(null); toast('已切换至\n' + a.name); }}>
                <span className="acc-av"/>
                <div className="acc-b">
                  <div className="acc-n">{a.name}</div>
                  <div className="acc-t">{a.tag} · {a.note}</div>
                </div>
                {a.id === accId && <span className="acc-ck"><Ico.check/></span>}
              </div>
            ))}
          </Sheet>
        )}

        {sheet === 'service' && (
          <Sheet title="在线客服" cancel="关闭" onClose={() => setSheet(null)}>
            <div className="kf">
              {[['在线咨询', <Ico.chat/>], ['电话客服', <Ico.headset/>], ['服务网点', <Ico.pin/>]].map(([t, ic], i) => (
                <div className="kf-item" key={i} onClick={() => { setSheet(null); toast(t === '电话客服' ? '拨打 400-887-8318' : t); }}>
                  {ic}<span>{t}</span>
                </div>
              ))}
            </div>
            <p className="sub-note" style={{ margin: '4px 0 10px' }}>
              服务时间 7×24 小时。涉及设备故障请优先提交「服务工单」，工程师将在 2 小时内响应。
            </p>
          </Sheet>
        )}

        {sheet === 'lang' && (
          <PickSheet title="语言" options={['跟随系统', '简体中文', 'English', 'Bahasa Indonesia']} value={settings.lang}
                     onClose={() => setSheet(null)}
                     onPick={v => { setSettings(s => ({ ...s, lang: v })); setSheet(null); toast('语言已切换为 ' + v); }}/>
        )}

        {sheet === 'star' && (
          <Sheet title="星星明细" cancel="关闭" onClose={() => setSheet(null)}>
            <div style={{ padding: '2px 0 10px', fontSize: 13, color: '#8A8C93' }}>
              当前 <b style={{ color: '#FF7A18', fontSize: 16 }}>{stars}</b> 颗 ≈ Rp {fmtRp(stars * 100)},-（1 颗星星 ≈ Rp 100）
            </div>
            {[
              { l: '一键领取签到星星', d: '今天 15:19', n: claimed ? '+8' : '—' },
              { l: '9.17 每日签到',    d: '9.17 09:02', n: '+5' },
              { l: '9.16 完善企业资料', d: '9.16 14:30', n: '+3' },
              { l: '积分商城兑换',      d: '9.12 10:44', n: '-20', minus: true },
            ].map((r, i) => (
              <div className="star-log" key={i}>
                <div className="l">{r.l}<div className="d">{r.d}</div></div>
                <span className={'n' + (r.minus ? ' minus' : '')}>{r.n}</span>
              </div>
            ))}
          </Sheet>
        )}

        {msg && <div className="toast">{msg}</div>}
      </div>
    </div>
  );
}

function openFab(toast) { toast('快捷工具箱\n扫一扫 / 报修 / 找配件'); }

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
