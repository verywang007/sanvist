<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>租户管理 - MySANY</title>
  <link rel="shortcut icon" type="image/x-icon" href="./static/favicon.ico" />
  <link rel="stylesheet" href="./app.css" />
  <link rel="stylesheet" href="./tenant-management.css" />
</head>
<body class="tenant-page-body">
  <header class="hd">
    <div class="hd-logo"><img src="./static/icon-mysanyLogo.svg" alt="My SANY" /></div>
    <div class="hd-sp"></div>
    <div class="hd-right">
      <button class="hd-item tn-hd-button" id="tn-bell" type="button" aria-label="通知">
        <span class="bell-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <em class="bell-badge">10</em>
        </span>
      </button>
      <button class="hd-item tn-hd-button" id="tn-language" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
        <span>简体中文</span>
      </button>
      <button class="hd-item tn-hd-button" id="tn-tenant" type="button">
        <span>2603181012测试客户</span>
        <svg class="hd-caret" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 16 4 8h16z"/></svg>
      </button>
      <button class="hd-item tn-hd-button" id="tn-user" type="button">
        <span class="hd-avatar">🧑</span><span>5656</span>
        <svg class="hd-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
  </header>

  <aside class="sider">
    <nav class="menu" id="menu" aria-label="主导航"></nav>
    <div class="sider-ft">
      <div class="deco"></div>
      <button class="tg tn-icon-button" id="toggle" type="button" title="收起 / 展开" aria-label="收起或展开导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg>
      </button>
    </div>
  </aside>

  <main class="main tenant-main">
    <div class="tenant-container">
      <div class="tenant-tabs" id="tenant-tabs" role="tablist">
        <button class="tenant-tab active" type="button" role="tab" aria-selected="true" data-tenant-tab="tenant">租户管理</button>
        <button class="tenant-tab" type="button" role="tab" aria-selected="false" data-tenant-tab="auth">客户认证</button>
      </div>
      <div class="tenant-content" id="tenant-content"></div>
    </div>
  </main>

  <div class="flyout" id="flyout" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="tenant-modal-root"></div>

  <script src="./data.js"></script>
  <script src="./tenant-management.js"></script>
</body>
</html>
