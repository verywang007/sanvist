<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>组织管理 - MySANY</title>
  <link rel="shortcut icon" type="image/x-icon" href="./static/favicon.ico" />
  <link rel="stylesheet" href="./app.css" />
  <link rel="stylesheet" href="./organization.css" />
</head>
<body class="organization-page">
  <header class="hd">
    <div class="hd-logo"><img src="./static/icon-mysanyLogo.svg" alt="My SANY" /></div>
    <div class="hd-sp"></div>
    <div class="hd-right">
      <button class="hd-item hd-button" id="org-bell" type="button" aria-label="通知">
        <span class="bell-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
          </svg>
          <em class="bell-badge">10</em>
        </span>
      </button>
      <button class="hd-item hd-button" id="org-language" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
        <span>简体中文</span>
      </button>
      <button class="hd-item hd-button" id="org-tenant" type="button">
        <span>2603181012测试客户</span>
        <svg class="hd-caret" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 16 4 8h16z"/></svg>
      </button>
      <button class="hd-item hd-button" id="org-user" type="button">
        <span class="hd-avatar">🧑</span><span>5656</span>
        <svg class="hd-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
  </header>

  <aside class="sider">
    <nav class="menu" id="menu" aria-label="主导航"></nav>
    <div class="sider-ft">
      <div class="deco"></div>
      <button class="tg org-icon-button" id="toggle" type="button" title="收起 / 展开" aria-label="收起或展开导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/>
        </svg>
      </button>
    </div>
  </aside>

  <main class="main org-main">
    <div class="org-layout">
      <aside class="org-tree-panel" aria-label="组织架构">
        <div class="org-tree-head">
          <h1>组织架构</h1>
          <label class="org-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="org-search" type="search" placeholder="搜索组织" autocomplete="off" />
          </label>
        </div>
        <div class="org-tree" id="org-tree" role="tree"></div>
      </aside>

      <section class="org-content" aria-label="组织详情">
        <div class="org-info-section">
          <h2>组织信息</h2>
          <div class="org-info-card" id="org-info"></div>
        </div>
        <div class="org-workspace">
          <div class="org-toolbar" id="org-toolbar"></div>
          <div class="org-table-wrap" id="org-table-wrap"></div>
          <div class="org-pagination" id="org-pagination"></div>
        </div>
      </section>
    </div>
  </main>

  <div class="flyout" id="flyout" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="./data.js"></script>
  <script src="./organization.js"></script>
</body>
</html>
