<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>用户管理 - MySANY</title>
  <link rel="shortcut icon" type="image/x-icon" href="./static/favicon.ico" />
  <link rel="stylesheet" href="./app.css" />
  <link rel="stylesheet" href="./user-management.css" />
</head>
<body class="user-page-body">
  <header class="hd">
    <div class="hd-logo"><img src="./static/icon-mysanyLogo.svg" alt="My SANY" /></div>
    <div class="hd-sp"></div>
    <div class="hd-right">
      <button class="hd-item um-hd-button" id="um-bell" type="button" aria-label="通知"><span class="bell-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><em class="bell-badge">10</em></span></button>
      <button class="hd-item um-hd-button" id="um-language" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg><span>简体中文</span></button>
      <button class="hd-item um-hd-button" id="um-tenant" type="button"><span>2603181012测试客户</span><svg class="hd-caret" viewBox="0 0 24 24" fill="currentColor"><path d="M12 16 4 8h16z"/></svg></button>
      <button class="hd-item um-hd-button" id="um-user" type="button"><span class="hd-avatar">🧑</span><span>5656</span><svg class="hd-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
  </header>
  <aside class="sider">
    <nav class="menu" id="menu" aria-label="主导航"></nav>
    <div class="sider-ft"><div class="deco"></div><button class="tg um-icon-button" id="toggle" type="button" title="收起 / 展开"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg></button></div>
  </aside>
  <main class="main user-main">
    <div class="user-container">
      <div class="user-filter" id="user-filter"></div>
      <div class="user-table-wrap" id="user-table-wrap"></div>
      <div class="user-pagination" id="user-pagination"></div>
    </div>
  </main>
  <div class="flyout" id="flyout" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="user-modal-root"></div>
  <script src="./data.js"></script>
  <script src="./user-management.js"></script>
</body>
</html>
